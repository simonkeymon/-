<div class="top"><span>人工智能简史 · <b>A BRIEF HISTORY OF AI</b></span><span>第一章 / 起源</span></div>
<div class="chap">Chapter I — The Naming</div>
<div class="year">1956</div>
<div class="head">一个夏天，<br>一台机器的<em>名字</em>。</div>
<div class="body">新罕布什尔州，达特茅斯学院。十位年轻学者聚在一起，讨论一个大胆的问题：机器能否像人一样思考？这场为期八周的研讨会，让“人工智能”第一次拥有了自己的名字。</div>
<div class="quote">“智能的任何特征，原则上都能被精确描述，以至于可以造一台机器来模拟它。”<small>—— 1955 年研讨会提案</small></div>
